spring:
  datasource:
    url: jdbc:h2:mem:anushabazaar_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

app:
  auth:
    signup-verification-expiry-minutes: 60
  jwt:
    secret: 0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF
    access-expiry-hours: 24
    refresh-expiry-days: 7
  file-storage:
    root: target/investment-test-uploads

logging:
  level:
    root: WARN
    com.anushabazaar.backend: INFO
