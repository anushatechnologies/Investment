spring:
  application:
    name: anushabazaar-backend
  main:
    banner-mode: off
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/anushabazaar?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:2395}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  mail:
    host: ${SPRING_MAIL_HOST:smtpout.secureserver.net}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    com.anushabazaar.backend: INFO

app:
  seed:
    default-admins: ${APP_SEED_DEFAULT_ADMINS:true}
    admin:
      email: ${APP_ADMIN_EMAIL:}
      password: ${APP_ADMIN_PASSWORD:}
      full-name: ${APP_ADMIN_FULL_NAME:ADMIN}
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://anushatrade.com,https://anushatrade.com,http://www.anushatrade.com,https://www.anushatrade.com}
  email:
    enabled: ${APP_EMAIL_ENABLED:false}
    from: ${APP_EMAIL_FROM:${SPRING_MAIL_USERNAME:}}
    expose-generated-values: ${APP_EMAIL_EXPOSE_GENERATED_VALUES:true}
  jwt:
    secret: ${APP_JWT_SECRET:0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF}
    access-expiry-hours: ${APP_JWT_ACCESS_EXPIRY_HOURS:24}
    refresh-expiry-days: ${APP_JWT_REFRESH_EXPIRY_DAYS:7}
  file-storage:
    provider: ${APP_FILE_STORAGE_PROVIDER:local}
    root: ${APP_FILE_STORAGE_ROOT:uploads}
    s3:
      bucket: ${APP_FILE_STORAGE_S3_BUCKET:}
      region: ${APP_FILE_STORAGE_S3_REGION:ap-south-1}
      prefix: ${APP_FILE_STORAGE_S3_PREFIX:anushabazaar}
      public-base-url: ${APP_FILE_STORAGE_S3_PUBLIC_BASE_URL:}
      fallback-to-local: ${APP_FILE_STORAGE_S3_FALLBACK_TO_LOCAL:true}
  firebase:
    project-id: ${APP_FIREBASE_PROJECT_ID:anushabazaar-2288e}
    service-account-resource: ${APP_FIREBASE_SERVICE_ACCOUNT_RESOURCE:anushabazaar-2288e-firebase-adminsdk-fbsvc-e520eea937.json}
    service-account-path: ${APP_FIREBASE_SERVICE_ACCOUNT_PATH:}
    service-account-json: ${APP_FIREBASE_SERVICE_ACCOUNT_JSON:}
    service-account-base64: ${APP_FIREBASE_SERVICE_ACCOUNT_BASE64:}
  razorpay:
    enabled: ${APP_RAZORPAY_ENABLED:false}
    key-id: ${APP_RAZORPAY_KEY_ID:}
    key-secret: ${APP_RAZORPAY_KEY_SECRET:}
    webhook-secret: ${APP_RAZORPAY_WEBHOOK_SECRET:}
    currency: ${APP_RAZORPAY_CURRENCY:INR}
    auto-capture: ${APP_RAZORPAY_AUTO_CAPTURE:true}
    api-base-url: ${APP_RAZORPAY_API_BASE_URL:https://api.razorpay.com/v1}
