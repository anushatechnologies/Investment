spring:
  application:
    name: anushabazaar-backend
  main:
    banner-mode: off
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/anushabazaar?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:2395}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    com.anushabazaar.backend: INFO

app:
  jwt:
    secret: ${APP_JWT_SECRET:0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF}
    access-expiry-hours: ${APP_JWT_ACCESS_EXPIRY_HOURS:24}
    refresh-expiry-days: ${APP_JWT_REFRESH_EXPIRY_DAYS:7}
  file-storage:
    root: ${APP_FILE_STORAGE_ROOT:uploads}
  firebase:
    project-id: ${APP_FIREBASE_PROJECT_ID:anushabazaar-2288e}
    service-account-resource: ${APP_FIREBASE_SERVICE_ACCOUNT_RESOURCE:anushabazaar-2288e-firebase-adminsdk-fbsvc-e520eea937.json}
    service-account-path: ${APP_FIREBASE_SERVICE_ACCOUNT_PATH:}
    service-account-json: ${APP_FIREBASE_SERVICE_ACCOUNT_JSON:}
    service-account-base64: ${APP_FIREBASE_SERVICE_ACCOUNT_BASE64:}
