spring:
  application:
    name: anushabazaar-backend
  main:
    banner-mode: off
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/anushabazaar?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:2395}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    com.anushabazaar.backend: INFO

app:
  jwt:
    secret: 0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF
    access-expiry-hours: 720 # 30 days
    refresh-expiry-days: 30 # 30 days
  file-storage:
    root: ${APP_FILE_STORAGE_ROOT:uploads}
    mode: ${APP_FILE_STORAGE_MODE:${APP_FILE_STORAGE_PROVIDER:s3}}
    s3-access-key: ${APP_FILE_STORAGE_S3_ACCESS_KEY:${AWS_ACCESS_KEY_ID:}}
    s3-region: ${APP_FILE_STORAGE_S3_REGION:${AWS_REGION:ap-south-2}}
    s3-bucket: ${APP_FILE_STORAGE_S3_BUCKET:${AWS_S3_BUCKET:}}
    s3-secret-key: ${APP_FILE_STORAGE_S3_SECRET_KEY:${AWS_SECRET_ACCESS_KEY:}}
    fallback-to-local: ${APP_FILE_STORAGE_FALLBACK_TO_LOCAL:true}
  whatsapp:
    phone-number-id: ${META_PHONE_NUMBER_ID:mock_phone_number_id}
    access-token: ${META_ACCESS_TOKEN:mock_access_token}
    enabled: ${META_WHATSAPP_ENABLED:true}
  sms:
    fast2sms-api-key: ${FAST2SMS_API_KEY:}
    enabled: ${SMS_ENABLED:true}
  razorpay:
    enabled: ${RAZORPAY_ENABLED:true}
    key-id: ${RAZORPAY_KEY_ID:rzp_live_TO6q7NUVnPM6bA}
    key-secret: ${RAZORPAY_KEY_SECRET:dummy_razorpay_secret}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:dummy_webhook_secret}
    currency: INR
    auto-capture: true
