name: AWS EC2 CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EC2_HOST: ${{ vars.EC2_HOST }}
  EC2_USER: ${{ vars.EC2_USER }}
  APP_PORT: ${{ vars.APP_PORT }}
  SPRING_DATASOURCE_URL: ${{ vars.SPRING_DATASOURCE_URL }}
  SPRING_DATASOURCE_USERNAME: ${{ vars.SPRING_DATASOURCE_USERNAME }}

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Build And Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Package jar
        run: mvn -B -DskipTests package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/backend-0.0.1-SNAPSHOT.jar

  deploy:
    name: Push To ECR And Deploy EC2
    runs-on: ubuntu-latest
    needs: test
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: target

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Create runtime env file
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
        run: |
          cat > runtime.env <<EOF
          SPRING_DATASOURCE_URL=$SPRING_DATASOURCE_URL
          SPRING_DATASOURCE_USERNAME=$SPRING_DATASOURCE_USERNAME
          SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD
          APP_JWT_SECRET=$APP_JWT_SECRET
          APP_FILE_STORAGE_ROOT=/app/uploads
          EOF

      - name: Copy runtime env file to EC2
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "mkdir -p ~/investment-backend"
          scp -i ~/.ssh/ec2_key runtime.env "$EC2_USER@$EC2_HOST:~/investment-backend/.env"

      - name: Deploy Docker container on EC2
        env:
          IMAGE_URI: ${{ steps.image.outputs.image }}
          ECR_REGISTRY: ${{ steps.image.outputs.registry }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            "AWS_REGION='$AWS_REGION' ECR_REGISTRY='$ECR_REGISTRY' IMAGE_URI='$IMAGE_URI' APP_PORT='$APP_PORT' bash -s" <<'EOF'
          set -euo pipefail

          APP_DIR="$HOME/investment-backend"
          CONTAINER_NAME="investment-backend"

          mkdir -p "$APP_DIR"
          chmod 600 "$APP_DIR/.env"

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          docker pull "$IMAGE_URI"
          docker stop "$CONTAINER_NAME" || true
          docker rm "$CONTAINER_NAME" || true

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --env-file "$APP_DIR/.env" \
            -p "$APP_PORT:8080" \
            -v investment_uploads:/app/uploads \
            "$IMAGE_URI"

          docker image prune -af
          docker ps --filter "name=$CONTAINER_NAME"
          EOF
