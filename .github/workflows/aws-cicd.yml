name: AWS EC2 CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Build And Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Package jar
        run: mvn -B -DskipTests package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/backend-0.0.1-SNAPSHOT.jar

  deploy:
    name: Push To ECR And Deploy EC2
    runs-on: ubuntu-latest
    needs: test
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-south-2' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || secrets.ECR_REPOSITORY || 'anushabazaar-backend' }}
      EC2_HOST: ${{ vars.EC2_HOST || secrets.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER || secrets.EC2_USER || 'ec2-user' }}
      APP_PORT: ${{ vars.APP_PORT || secrets.APP_PORT || vars.CONTAINER_PORT || secrets.CONTAINER_PORT || '8080' }}
      SPRING_DATASOURCE_URL: ${{ vars.SPRING_DATASOURCE_URL || secrets.SPRING_DATASOURCE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ vars.SPRING_DATASOURCE_USERNAME || secrets.SPRING_DATASOURCE_USERNAME }}
      APP_FILE_STORAGE_PROVIDER: ${{ vars.APP_FILE_STORAGE_PROVIDER || secrets.APP_FILE_STORAGE_PROVIDER || 'local' }}
      APP_FILE_STORAGE_S3_REGION: ${{ vars.APP_FILE_STORAGE_S3_REGION || secrets.APP_FILE_STORAGE_S3_REGION || vars.AWS_REGION || secrets.AWS_REGION || 'ap-south-2' }}
      APP_FILE_STORAGE_S3_PREFIX: ${{ vars.APP_FILE_STORAGE_S3_PREFIX || secrets.APP_FILE_STORAGE_S3_PREFIX || 'anushabazaar' }}
      APP_FILE_STORAGE_S3_PUBLIC_BASE_URL: ${{ vars.APP_FILE_STORAGE_S3_PUBLIC_BASE_URL || secrets.APP_FILE_STORAGE_S3_PUBLIC_BASE_URL }}
      APP_EMAIL_ENABLED: ${{ vars.APP_EMAIL_ENABLED || secrets.APP_EMAIL_ENABLED || 'false' }}
      APP_EMAIL_EXPOSE_GENERATED_VALUES: ${{ vars.APP_EMAIL_EXPOSE_GENERATED_VALUES || secrets.APP_EMAIL_EXPOSE_GENERATED_VALUES || 'false' }}
      APP_FRONTEND_BASE_URL: ${{ vars.APP_FRONTEND_BASE_URL || secrets.APP_FRONTEND_BASE_URL || 'http://localhost:3000' }}
      APP_SEED_DEFAULT_ADMINS: ${{ vars.APP_SEED_DEFAULT_ADMINS || secrets.APP_SEED_DEFAULT_ADMINS || 'false' }}
      APP_ADMIN_FULL_NAME: ${{ vars.APP_ADMIN_FULL_NAME || secrets.APP_ADMIN_FULL_NAME || 'ADMIN' }}
      APP_RAZORPAY_ENABLED: ${{ vars.APP_RAZORPAY_ENABLED || secrets.APP_RAZORPAY_ENABLED || 'true' }}
      APP_RAZORPAY_CURRENCY: ${{ vars.APP_RAZORPAY_CURRENCY || secrets.APP_RAZORPAY_CURRENCY || 'INR' }}
      APP_RAZORPAY_AUTO_CAPTURE: ${{ vars.APP_RAZORPAY_AUTO_CAPTURE || secrets.APP_RAZORPAY_AUTO_CAPTURE || 'true' }}
      APP_RAZORPAY_API_BASE_URL: ${{ vars.APP_RAZORPAY_API_BASE_URL || secrets.APP_RAZORPAY_API_BASE_URL || 'https://api.razorpay.com/v1' }}
      SPRING_MAIL_HOST: ${{ vars.SPRING_MAIL_HOST || secrets.SPRING_MAIL_HOST || 'smtpout.secureserver.net' }}
      SPRING_MAIL_PORT: ${{ vars.SPRING_MAIL_PORT || secrets.SPRING_MAIL_PORT || '587' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: target

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Create runtime env file
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          APP_FIREBASE_PROJECT_ID: ${{ secrets.APP_FIREBASE_PROJECT_ID }}
          RAW_FIREBASE_BASE64: ${{ secrets.APP_FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          APP_FILE_STORAGE_S3_BUCKET: ${{ secrets.APP_FILE_STORAGE_S3_BUCKET }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
          APP_EMAIL_FROM: ${{ secrets.APP_EMAIL_FROM }}
          APP_ADMIN_EMAIL: ${{ secrets.APP_ADMIN_EMAIL }}
          APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}
          APP_RAZORPAY_KEY_ID: ${{ secrets.APP_RAZORPAY_KEY_ID }}
          APP_RAZORPAY_KEY_SECRET: ${{ secrets.APP_RAZORPAY_KEY_SECRET }}
          APP_RAZORPAY_WEBHOOK_SECRET: ${{ secrets.APP_RAZORPAY_WEBHOOK_SECRET }}
        run: |
          CLEAN_FIREBASE_BASE64=$(echo "$RAW_FIREBASE_BASE64" | tr -d '\r\n\t ')
          cat > runtime.env <<EOF
          SPRING_PROFILES_ACTIVE=prod
          SPRING_DATASOURCE_URL=$SPRING_DATASOURCE_URL
          SPRING_DATASOURCE_USERNAME=$SPRING_DATASOURCE_USERNAME
          SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD
          SPRING_JPA_HIBERNATE_DDL_AUTO=update
          APP_JWT_SECRET=$APP_JWT_SECRET
          APP_FIREBASE_PROJECT_ID=$APP_FIREBASE_PROJECT_ID
          APP_FIREBASE_SERVICE_ACCOUNT_BASE64=$CLEAN_FIREBASE_BASE64
          APP_FILE_STORAGE_PROVIDER=$APP_FILE_STORAGE_PROVIDER
          APP_FILE_STORAGE_ROOT=/app/uploads
          APP_FILE_STORAGE_S3_BUCKET=$APP_FILE_STORAGE_S3_BUCKET
          APP_FILE_STORAGE_S3_REGION=$APP_FILE_STORAGE_S3_REGION
          APP_FILE_STORAGE_S3_PREFIX=$APP_FILE_STORAGE_S3_PREFIX
          APP_FILE_STORAGE_S3_PUBLIC_BASE_URL=$APP_FILE_STORAGE_S3_PUBLIC_BASE_URL
          APP_EMAIL_ENABLED=$APP_EMAIL_ENABLED
          APP_EMAIL_EXPOSE_GENERATED_VALUES=$APP_EMAIL_EXPOSE_GENERATED_VALUES
          APP_FRONTEND_BASE_URL=$APP_FRONTEND_BASE_URL
          SPRING_MAIL_HOST=$SPRING_MAIL_HOST
          SPRING_MAIL_PORT=$SPRING_MAIL_PORT
          SPRING_MAIL_USERNAME=$SPRING_MAIL_USERNAME
          SPRING_MAIL_PASSWORD=$SPRING_MAIL_PASSWORD
          APP_EMAIL_FROM=$APP_EMAIL_FROM
          APP_SEED_DEFAULT_ADMINS=$APP_SEED_DEFAULT_ADMINS
          APP_ADMIN_EMAIL=$APP_ADMIN_EMAIL
          APP_ADMIN_PASSWORD=$APP_ADMIN_PASSWORD
          APP_ADMIN_FULL_NAME=$APP_ADMIN_FULL_NAME
          APP_RAZORPAY_ENABLED=$APP_RAZORPAY_ENABLED
          APP_RAZORPAY_KEY_ID=$APP_RAZORPAY_KEY_ID
          APP_RAZORPAY_KEY_SECRET=$APP_RAZORPAY_KEY_SECRET
          APP_RAZORPAY_WEBHOOK_SECRET=$APP_RAZORPAY_WEBHOOK_SECRET
          APP_RAZORPAY_CURRENCY=$APP_RAZORPAY_CURRENCY
          APP_RAZORPAY_AUTO_CAPTURE=$APP_RAZORPAY_AUTO_CAPTURE
          APP_RAZORPAY_API_BASE_URL=$APP_RAZORPAY_API_BASE_URL
          EOF

      - name: Copy runtime env file to EC2
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "mkdir -p ~/investment-backend"
          scp -i ~/.ssh/ec2_key runtime.env "$EC2_USER@$EC2_HOST:~/investment-backend/.env"

      - name: Deploy Docker container on EC2
        env:
          IMAGE_URI: ${{ steps.image.outputs.image }}
          ECR_REGISTRY: ${{ steps.image.outputs.registry }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            "AWS_REGION='$AWS_REGION' ECR_REGISTRY='$ECR_REGISTRY' IMAGE_URI='$IMAGE_URI' APP_PORT='$APP_PORT' bash -s" <<'EOF'
          set -euo pipefail

          APP_DIR="$HOME/investment-backend"
          CONTAINER_NAME="investment-backend"

          mkdir -p "$APP_DIR"
          chmod 600 "$APP_DIR/.env"

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          docker pull "$IMAGE_URI"
          docker stop "$CONTAINER_NAME" || true
          docker rm "$CONTAINER_NAME" || true

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --env-file "$APP_DIR/.env" \
            -p "$APP_PORT:8080" \
            -v investment_uploads:/app/uploads \
            "$IMAGE_URI"

          docker image prune -af
          docker ps --filter "name=$CONTAINER_NAME"
          EOF
